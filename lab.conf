#  APT29 SIEM Lab - configuration
#
#  Edit this file, then apply it with:   ./setup.sh --reshift

# Where the replayed attack lands on the clock.
#
# ANCHOR_DATE pins the whole class to one identical timeline, so your screen
# and every student's screen show the same timestamps.
#   YYYY-MM-DD  fixed date (everyone sees the same thing)
#   today       follow whatever day the lab is built on
ANCHOR_DATE=2026-09-10
ANCHOR_LOCAL=10:00
ANCHOR_TZ=Asia/Taipei

# Elastic stack
#
# The Compose project name is pinned in docker-compose.yml ('name:'), so it is
# applied even when Compose is run without --env-file.
STACK_VERSION=8.19.21

# Elasticsearch heap. The container is capped at 4g in docker-compose.yml,
# so keep this at or below 2g unless you also raise that limit.
ES_JAVA_OPTS=-Xms2g -Xmx2g

# Endpoints (only change if you remap the ports in docker-compose.yml)
ES_URL=http://localhost:9200
KIBANA_URL=http://localhost:5601
