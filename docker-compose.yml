# APT29 SIEM demo - single-node Elasticsearch + Kibana, localhost only.
# Security is disabled on purpose: this is a throwaway local demo stack with no
# credentials to manage. Do not expose these ports beyond localhost.
#
# The project name is pinned here rather than left to the directory name, so
# that renaming or cloning the repo does not orphan running containers and
# volumes. It lives in this file (not lab.conf) because Compose reads a top
# level 'name' on every invocation, whereas an env file is only read when
# --env-file is passed -- so a bare "docker compose down" still targets the
# right project.
name: apt29-siem-lab

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:-8.19.21}
    container_name: apt29-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - xpack.license.self_generated.type=basic
      - ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms2g -Xmx2g}
      - bootstrap.memory_lock=true
      - action.destructive_requires_name=false
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    mem_limit: 4g
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION:-8.19.21}
    container_name: apt29-kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_PUBLICBASEURL=http://localhost:5601
      # Stable encryption keys so saved objects / detection rules survive a restart.
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=apt29demoapt29demoapt29demoapt29demo01
      - XPACK_SECURITY_ENCRYPTIONKEY=apt29demoapt29demoapt29demoapt29demo02
      - XPACK_REPORTING_ENCRYPTIONKEY=apt29demoapt29demoapt29demoapt29demo03
    mem_limit: 2g
    ports:
      - "127.0.0.1:5601:5601"
    volumes:
      - kibanadata:/usr/share/kibana/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 90s

  # Sits in front of Elasticsearch for the MCP server only. The Elastic MCP
  # server cannot parse a mapping containing object fields, which is every ECS
  # mapping; this flattens _mapping responses to dotted fields. See
  # docs/mcp-setup.md.
  mcp-proxy:
    image: python:3.12-alpine
    container_name: apt29-mcp-proxy
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ES_UPSTREAM=http://elasticsearch:9200
      - PROXY_PORT=9280
    command: ["python", "/app/es_mapping_proxy.py"]
    volumes:
      - ./scripts/es_mapping_proxy.py:/app/es_mapping_proxy.py:ro
    mem_limit: 128m
    ports:
      - "127.0.0.1:9280:9280"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:9280/_cluster/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s


volumes:
  esdata:
  kibanadata:
